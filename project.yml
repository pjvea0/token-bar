name: TokenBar
options:
  bundleIdPrefix: com.charles
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 15.0
    CODE_SIGN_STYLE: Automatic
targets:
  TokenBar:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.charles.TokenBar
        PRODUCT_NAME: TokenBar
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: TokenBar
        ENABLE_APP_SANDBOX: NO
    scheme:
      testTargets:
        - TokenBarTests
  TokenBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: TokenBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.charles.TokenBarTests
        GENERATE_INFOPLIST_FILE: YES
