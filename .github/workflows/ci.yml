name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test
        run: make test DERIVED_DATA="$RUNNER_TEMP/TokenBarDerivedData"
      - name: Verify clean generated state
        run: git diff --exit-code
